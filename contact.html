<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="assets.html/CSS/style.css">
</head>
<body>
    <header>                <!--Entête avec liens de navigation-->
        <H1>Boulangerie artisanale LE FOURNIL</H1>
    
        <nav>                   <!-- Menu déroulant de navigation du site-->
            <UL class="menu">
                <LI><A href="index.html" >Accueil</A></LI>
                <LI><a href="carte.html">La carte</a></LI>
                <LI><a href="contact.html">Contact</a></LI>
            </UL>
        </NAV>
    </header>
    <main>
        <!-- Formulaire de contact-->
        <form action="#" method="post">     
            <fieldset class="coordo">

               <!-- Partie COORDONNEES du formulaire--> 
                <legend>Vos coordonnées</legend>        
                    <label for="Nom" >Nom </label>
                        <input type="text" id="Nom" name="Nom" required>
                        
                    <label for="email">Email </label>
                        <input type="email" id="email" name="email" required>

                    <label for="tel">Téléphone</label>
                        <input type="tel" id="tel" name="Téléphone" required>
            </fieldset>
            <fieldset class="commandes">
                <!-- partie COMMANDE du formulaire-->
                <legend>Votre commande</legend>         
                    <label for="date_retrait">Date de retrait</label>
                        <input type="date" name="date" id="date_retrait" required>

                    <label for="produit">produits</label>
                    <!-- MENU DEROULANT CHOIX PRODUIT-->
                    <select name="produits" id="produit" class="champ-produit" required>   
                        <option value="">-- Choisissez un produit --</option>
                        <option value="Pain_complet">Pain complet</option>
                        <option value="Baguette_tradition">Baguette tradition</option>
                        <option value="Pain_de_campagne">Pain de campagne</option>
                    </select>
                    <select name="Quantite" id="QUANTITE"></select>
                    <label for="Quantite">Quantité (entre 1 et 20)</label>                  <!--MENU DEROULANT QUANTITE SOUHAITEE-->
                        <input type="number"
                               name="Quantité"
                               id="Quantite"
                               class="champ-quantite"
                               min="1"
                               max="20" 
                               required;>
            </fieldset>
            
            <fieldset>
                <legend>Sélectionnez un mode de retrait</legend>        <!-- MENU DEROULANT MODE DE RETRAIT DE LA COMMANDE-->
                <div>
                    <input type="radio" id="En_magasin" name="retrait" value="En_magasin" required>
                    <label for="En_magasin" >En magasin</label>
                </div>
                <div>
                    <input type="radio" id="Livraison" name="retrait" value="Livraison" >
                    <label for="Livraison">Livraison</label>
                </div>
            </fieldset>
            <div class="commentaire">
                <label for="message-commande">Votre message (maximum 300 caractères)</label>     <!-- ZONE COMMENTAIRE CLIENT-->
                <textarea name="message" id="message-commande"  rows="4" maxlength="300"></textarea>
            </div>
            <br>
            <label for="CGV">Merci d'accepter les CGV</label>    <!-- CASE A COCHER CDG--> 
                <input type="checkbox" name="CGV" id="CGV" required>

            <br>
            <button>Soumettre le formulaire</button>            <!-- ENVOI DU FORMULAIRE-->
        </form>
    </main>
    <footer>     <!-- pied de page, adresse et coordonnées du commerce-->
        <p>20 allée de la gourmandise, 75000 Paris</p>
        <p>Horaires : du lundi au dimanche de 7h30 à 19h30 sans interruption</p>
    </footer>
</body>
</html>
